# eksctl cluster definition (used by scripts/01-create-cluster.sh).
# Double-underscore placeholders are filled by scripts/00-configure.sh.
# eksctl builds the VPC (3 AZs, public + private subnets, already tagged for
# ALBs), the control plane, the add-ons and a private managed node group.
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: argo-eks
  region: ap-south-1
  version: "1.36"
  tags:
    managed-by: eksctl
    project: eks-argocd-3tier

vpc:
  cidr: 10.1.0.0/16
  nat:
    gateway: Single              # HighlyAvailable = one NAT per AZ (~3x cost)
  clusterEndpoints:
    publicAccess: true
    privateAccess: true
  # publicAccessCIDRs: ["203.0.113.10/32"]   # lock the API to your IP

accessConfig:
  authenticationMode: API        # EKS access entries, no aws-auth ConfigMap

addons:
  - name: vpc-cni
    configurationValues: '{"enableNetworkPolicy":"true"}'
  - name: kube-proxy
  - name: coredns
  - name: eks-pod-identity-agent
  - name: metrics-server         # needed by the backend HPA
  - name: aws-ebs-csi-driver     # Postgres volume
    podIdentityAssociations:
      - namespace: kube-system
        serviceAccountName: ebs-csi-controller-sa
        permissionPolicyARNs:
          - arn:aws:iam::aws:policy/service-role/AmazonEBSCSIDriverPolicy

# Controller permissions via EKS Pod Identity. The policies are created from
# policies/*.json by scripts/01-create-cluster.sh before eksctl runs.
iam:
  podIdentityAssociations:
    - namespace: kube-system
      serviceAccountName: aws-load-balancer-controller
      permissionPolicyARNs:
        - arn:aws:iam::014882039467:policy/argo-eks-lbc
    - namespace: external-dns
      serviceAccountName: external-dns
      permissionPolicyARNs:
        - arn:aws:iam::014882039467:policy/argo-eks-external-dns

managedNodeGroups:
  - name: general
    amiFamily: AmazonLinux2023
    instanceType: t3.large
    minSize: 2
    desiredCapacity: 2
    maxSize: 4
    volumeSize: 50
    privateNetworking: true      # nodes in private subnets, egress via NAT
    labels: { role: general }

cloudWatch:
  clusterLogging:
    enableTypes: ["api", "audit", "authenticator"]
