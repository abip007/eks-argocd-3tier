# Production values. scripts/00-configure.sh fills the double-underscore placeholders once
# (or edit them by hand - see docs/01-console-guide.md). After that the only
# lines that change are the two 'newTag' values (scripts/03-release.sh).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base

images:
  - name: bmi-backend
    newName: 014882039467.dkr.ecr.ap-south-1.amazonaws.com/bmi-backend
    newTag: 7bf0540-20261109184410
  - name: bmi-frontend
    newName: 014882039467.dkr.ecr.ap-south-1.amazonaws.com/bmi-frontend
    newTag: 7bf0540-20261109184410

patches:
  - target: { kind: ConfigMap, name: backend-config }
    patch: |
      - op: replace
        path: /data/FRONTEND_URL
        value: https://argo-bmi.bestclick.click
  - target: { kind: Ingress, name: bmi }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: argo-bmi.bestclick.click
      - op: replace
        path: /metadata/annotations/alb.ingress.kubernetes.io~1certificate-arn
        value: arn:aws:acm:ap-south-1:014882039467:certificate/056cd22c-8739-46ef-bbb6-a192dd6e696b
