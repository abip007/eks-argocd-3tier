# Helm values for the external-dns chart (shell scripts + console guide).
# Creates Route 53 records for every Ingress host - no manual DNS step.
# bestclick.click, ap-south-1 and argo-eks are filled by scripts/00-configure.sh.
provider:
  name: aws
env:
  - name: AWS_DEFAULT_REGION
    value: ap-south-1
domainFilters: [bestclick.click]
policy: upsert-only          # never delete records it didn't create / safer default
txtOwnerId: argo-eks      # marks records as owned by this cluster
sources: [ingress]
serviceAccount:
  create: true
  name: external-dns         # must equal the Pod Identity association
